<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Bağlantı yok · Reblebi</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #f6f3ee; --card: #fff; --text: #16131f; --muted: #5d5868; --accent: #5b49f2; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0b0d12; --card: #151821; --text: #f3f1f8; --muted: #a7a2b5; --accent: #9085e9; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 420px; text-align: center; background: var(--card); padding: 32px 24px; border-radius: 18px; }
      img { width: 56px; height: 56px; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); }
      button { font: inherit; font-weight: 650; padding: 10px 20px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
      .en { margin-top: 18px; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Reblebi'ye ulaşılamıyor. Bağlantın gelince sayfayı yenile; planlanmış gönderilerin sunucuda zamanında yayınlanmaya devam eder.</p>
      <form method="get"><button type="submit">Tekrar dene</button></form>
      <p class="en" lang="en">You're offline. Scheduled posts keep publishing on the server.</p>
    </main>
  </body>
</html>
